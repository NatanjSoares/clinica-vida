{% extends "base.html" %}

{% block titulo %}Cadastrar paciente · Clínica Vida+{% endblock %}

{% block conteudo %}
<section class="cartao cartao-estreito">
    <h2>Cadastrar paciente</h2>

    {% if erro %}
    <p class="alerta erro" role="alert">Erro: {{ erro }}</p>
    {% endif %}

    <form class="formulario" id="form-paciente" method="post" action="{{ url_for('novo_paciente') }}">
        <div class="campo">
            <label for="nome">Nome do paciente</label>
            <input type="text" id="nome" name="nome" value="{{ dados.get('nome', '') }}" placeholder="Ex.: João Silva" required>
        </div>

        <div class="campo">
            <label for="idade">Idade</label>
            <input type="text" id="idade" name="idade" value="{{ dados.get('idade', '') }}" inputmode="numeric" placeholder="Ex.: 45" required>
        </div>

        <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" value="{{ dados.get('telefone', '') }}" placeholder="(11) 99999-9999" required>
        </div>

        <div class="acoes">
            <button type="submit" class="botao">Cadastrar</button>
            <a class="botao botao-claro" href="{{ url_for('listar_pacientes') }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
