{% extends "base.html" %}

{% block titulo %}Cadastrar paciente{% endblock %}

{% block conteudo %}
<h2>Cadastrar paciente</h2>

{% if erro %}
<p><strong>Erro: {{ erro }}</strong></p>
{% endif %}

<form method="post" action="{{ url_for('novo_paciente') }}">
    <p>
        <label>Nome do paciente:
            <input type="text" name="nome" value="{{ dados.get('nome', '') }}">
        </label>
    </p>
    <p>
        <label>Idade:
            <input type="text" name="idade" value="{{ dados.get('idade', '') }}">
        </label>
    </p>
    <p>
        <label>Telefone:
            <input type="text" name="telefone" value="{{ dados.get('telefone', '') }}">
        </label>
    </p>
    <p><button type="submit">Cadastrar</button></p>
</form>
{% endblock %}
