<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Clínica Vida+{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
    <header class="topo">
        <div class="container">
            <a class="marca" href="{{ url_for('listar_pacientes') }}">Clínica <span>Vida+</span></a>
            <nav class="menu">
                <a href="{{ url_for('listar_pacientes') }}" class="{{ 'ativo' if request.endpoint == 'listar_pacientes' }}">Pacientes</a>
                <a href="{{ url_for('novo_paciente') }}" class="{{ 'ativo' if request.endpoint == 'novo_paciente' }}">Cadastrar</a>
                <a href="{{ url_for('buscar_paciente') }}" class="{{ 'ativo' if request.endpoint == 'buscar_paciente' }}">Buscar</a>
                <a href="{{ url_for('ver_estatisticas') }}" class="{{ 'ativo' if request.endpoint == 'ver_estatisticas' }}">Estatísticas</a>
                <a href="{{ url_for('ver_fila') }}" class="{{ 'ativo' if request.endpoint in ['ver_fila', 'entrar_na_fila', 'atender_proximo'] }}">Fila</a>
                <a href="{{ url_for('verificar_regras') }}" class="{{ 'ativo' if request.endpoint == 'verificar_regras' }}">Regras de atendimento</a>
            </nav>
        </div>
    </header>

    <main class="container conteudo">
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="rodape">
        <div class="container">
            <p>Clínica Vida+ · Projeto Integrado de Análise e Desenvolvimento de Sistemas</p>
        </div>
    </footer>
</body>
</html>
